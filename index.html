<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14101c">
<title>Necromancer Idle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="field" width="960" height="540"></canvas>

  <div id="hud" class="hidden">
    <div class="pill" id="hud-zone">Zone</div>
    <div class="pill"><span class="ico">&#9760;</span> <b id="hud-souls">0</b> earned</div>
    <div class="pill" id="hud-wave">Wave 1/8</div>
    <div class="pill" id="hud-horde">Horde 3</div>
    <button id="btn-speed" class="pill btn">1x</button>
  </div>

  <div id="screen-home" class="screen home">
    <div class="home-panel">
      <div class="home-top">
        <div>
          <h1>Necromancer Idle</h1>
          <div class="rank">Rank: <b id="home-rank">Grave Robber</b> &middot; Power <b id="home-power">10</b></div>
        </div>
        <div class="banks">
          <div class="bank"><span class="ico">&#9760;</span> <b id="home-souls">0</b></div>
          <div class="bank champ"><span class="ico2">&#9819;</span> <b id="home-champ">0</b></div>
        </div>
      </div>
      <div id="home-note" class="note"></div>
      <div class="home-buttons">
        <button id="btn-map" class="big">Conquer Zones</button>
        <button id="btn-tree" class="big alt">Skill Tree <span id="tree-badge" class="badge hidden"></span></button>
      </div>
      <div id="home-hint" class="zone-info"></div>
      <button id="btn-reset" class="reset">Reset save</button>
    </div>
  </div>

  <div id="screen-map" class="screen page hidden">
    <div class="page-top">
      <button class="back" data-back>&larr; Back</button>
      <h2 id="map-title">The Greenmarch</h2>
      <div class="banks"><div class="bank"><span class="ico">&#9760;</span> <b class="b-souls">0</b></div></div>
    </div>
    <div id="region-tabs" class="tabs"></div>
    <div id="zones" class="zones"></div>
  </div>

  <div id="screen-tree" class="screen page hidden">
    <div class="page-top">
      <button class="back" data-back>&larr; Back</button>
      <h2>Skill Tree</h2>
      <div class="banks">
        <div class="bank"><span class="ico">&#9760;</span> <b class="b-souls">0</b></div>
        <div class="bank champ"><span class="ico2">&#9819;</span> <b class="b-champ">0</b></div>
      </div>
    </div>
    <div id="web" class="web">
      <div id="web-world" class="web-world"></div>
      <div class="web-zoom"><button id="web-zin">+</button><button id="web-zout">&minus;</button><button id="web-center">&#8982;</button></div>
      <div id="web-panel" class="web-panel hidden"></div>
    </div>
  </div>

  <button id="btn-mute" class="mute" aria-label="Toggle sound"></button>

  <div id="screen-result" class="screen hidden">
    <h2 id="result-title"></h2>
    <p id="result-text"></p>
    <button id="btn-home" class="big">Return Home</button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
