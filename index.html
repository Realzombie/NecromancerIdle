<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14101c">
<title>Necromancer Idle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="field" width="960" height="540"></canvas>

  <div id="hud" class="hidden">
    <div class="pill"><span class="ico">&#9760;</span> <b id="hud-souls">0</b> earned</div>
    <div class="pill" id="hud-wave">Wave 1/8</div>
    <div class="pill" id="hud-horde">Horde 3</div>
    <button id="btn-speed" class="pill btn">1x</button>
  </div>

  <div id="screen-home" class="screen home">
    <div class="home-panel">
      <div class="home-top">
        <div>
          <h1>Necromancer Idle</h1>
          <div class="rank">Rank: <b id="home-rank">Grave Robber</b></div>
        </div>
        <div class="bank"><span class="ico">&#9760;</span> <b id="home-souls">0</b></div>
      </div>
      <div id="home-note" class="note"></div>
      <div id="upgrades" class="cards"></div>
      <button id="btn-start" class="big">Enter: Graveyard Fields</button>
      <div id="zone-info" class="zone-info"></div>
    </div>
  </div>

  <div id="screen-result" class="screen hidden">
    <h2 id="result-title"></h2>
    <p id="result-text"></p>
    <button id="btn-home" class="big">Return Home</button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
