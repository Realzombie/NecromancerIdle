<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14101c">
<title>Necromancer Idle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="rotate"><div>Turn your phone sideways to play</div></div>
<div id="app">
  <canvas id="field" width="960" height="540"></canvas>

  <div id="hud" class="hidden">
    <div class="pill" id="hud-zone">Zone</div>
    <div class="pill"><span class="ico">&#9760;</span> <b id="hud-souls">0</b> collected</div>
    <div class="pill" id="hud-wave">Wave 1/8</div>
    <div class="pill" id="hud-horde">Horde 3</div>
    <button id="btn-pause" class="pill btn auto">Pause</button>
    <button id="btn-auto" class="pill btn auto">Auto: off</button>
    <button id="btn-speed" class="pill btn">1x</button>
  </div>

  <div id="screen-home" class="screen home">
    <div class="home-panel">
      <div class="home-top">
        <div>
          <h1>Necromancer Idle</h1>
          <div class="rank">Rank: <b id="home-rank">Grave Robber</b> &middot; Power <b id="home-power">10</b></div>
        </div>
        <div class="banks">
          <div class="bank"><span class="ico">&#9760;</span> <b id="home-souls">0</b></div>
          <div class="bank champ"><span class="ico2">&#9819;</span> <b id="home-champ">0</b></div>
        </div>
      </div>
      <div id="home-note" class="note"></div>
      <div class="home-buttons">
        <button id="btn-map" class="big">Conquer Zones</button>
        <button id="btn-tree" class="big alt">Skill Tree <span id="tree-badge" class="badge hidden"></span></button>
        <button id="btn-arm" class="big alt2">Armoury <span id="arm-badge" class="badge hidden"></span></button>
      </div>
      <button id="btn-rebirth" class="big rebirth">Rebirth <span id="rebirth-badge" class="badge hidden"></span></button>
      <div id="home-hint" class="zone-info"></div>
      <div class="savebar"><button id="btn-export" class="reset">Export save</button><button id="btn-import" class="reset">Import save</button><button id="btn-reset" class="reset">Reset save</button></div>
    </div>
  </div>

  <div id="screen-map" class="screen page hidden">
    <div class="page-top">
      <button class="back" data-back><i class="chev"></i><span>Back</span></button>
      <h2 id="map-title">World Map</h2>
      <div class="banks"><div class="bank"><span class="ico">&#9760;</span> <b class="b-souls">0</b></div></div>
    </div>
    <div id="map-view" class="map-view">
      <canvas id="map-canvas" width="640" height="360"></canvas>
      <div id="map-panel" class="web-panel hidden"></div>
    </div>
  </div>

  <div id="screen-tree" class="screen page hidden">
    <div class="page-top">
      <button class="back" data-back><i class="chev"></i><span>Back</span></button>
      <h2>Skill Tree</h2>
      <div class="banks">
        <div class="bank"><span class="ico">&#9760;</span> <b class="b-souls">0</b></div>
        <div class="bank champ"><span class="ico2">&#9819;</span> <b class="b-champ">0</b></div>
      </div>
    </div>
    <div id="web" class="web">
      <div id="web-world" class="web-world"></div>
      <div class="web-zoom"><button id="web-zin">+</button><button id="web-zout">&minus;</button><button id="web-center">&#8982;</button></div>
      <div id="web-panel" class="web-panel hidden"></div>
    </div>
  </div>

  <div id="spell-bar" class="spell-bar hidden"></div>

  <div id="screen-armoury" class="screen page hidden">
    <div class="page-top">
      <button class="back" data-back><i class="chev"></i><span>Back</span></button>
      <h2>Armoury</h2>
      <div class="banks">
        <div class="bank"><span class="ico">&#9760;</span> <b class="b-souls">0</b></div>
        <div class="bank dustbank"><span class="ico4">&#10022;</span> <b id="arm-dust">0</b></div>
      </div>
    </div>
    <div id="arm-tabs" class="tabs">
      <button class="tab on" data-tab="gear">Gear</button>
      <button class="tab" data-tab="records">Records</button>
      <button class="tab" data-tab="bestiary">Bestiary</button>
    </div>
    <div id="arm-body" class="arm-body"></div>
  </div>

  <div id="screen-rebirth" class="screen page hidden">
    <div class="page-top">
      <button class="back" data-back><i class="chev"></i><span>Back</span></button>
      <h2>Rebirth</h2>
      <div class="banks"><div class="bank essence"><span class="ico3">&#9672;</span> <b class="b-ess">0</b></div></div>
    </div>
    <div class="rebirth-body">
      <div class="rb-info">
        <div id="rb-text"></div>
        <button id="btn-rebirth-go" class="big">Rebirth</button>
      </div>
      <div id="perks" class="perks"></div>
    </div>
  </div>

  <button id="btn-menu" class="mute gear" aria-label="Settings">⚙</button>
  <button id="btn-art" class="mute item art" aria-label="Unit art style"></button>
  <button id="btn-full" class="mute item full hidden" aria-label="Fullscreen">⛶</button>
  <button id="btn-music" class="mute item music" aria-label="Toggle music"></button>
  <button id="btn-mute" class="mute item snd" aria-label="Toggle sound"></button>
  <div id="toast" class="toast hidden"></div>
  <div id="welcome" class="welcome hidden"><div class="wcard"><div class="wtitle2">Welcome back!</div><div id="welcome-text" class="wbody"></div><button id="welcome-ok" class="big">Continue</button></div></div>

  <div id="screen-result" class="screen hidden">
    <h2 id="result-title"></h2>
    <p id="result-text"></p>
    <div id="result-extra" class="result-extra"></div>
    <div class="result-btns"><button id="btn-retry" class="big alt">Fight Again</button><button id="btn-home" class="big">Return Home</button></div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
